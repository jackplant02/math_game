name: Build Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # If one OS fails, keep building the others
      matrix:
        include:
          # Linux builds
          - id: linux-x64
            os: ubuntu-latest
            binary_name: mathquiz-linux-x64
            archive_type: tar
          - id: linux-arm64
            os: ubuntu-24.04-arm
            binary_name: mathquiz-linux-arm64
            archive_type: tar
            
          # Windows builds
          - id: windows-x64
            os: windows-latest
            binary_name: mathquiz-windows-x64.exe
            archive_type: zip
          - id: windows-arm64
            os: windows-arm64 
            binary_name: mathquiz-windows-arm64.exe
            archive_type: zip
            
          # macOS builds
          - id: macos-arm64
            os: macos-latest
            binary_name: mathquiz-macos-arm64
            archive_type: zip
          - id: macos-x64
            os: macos-15-intel
            binary_name: mathquiz-macos-x64
            archive_type: zip

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller --onefile --name ${{ matrix.binary_name }} mathquiz/math_game.py

    - name: Package Assets
      shell: bash
      run: |
        # Make the packaging step OS-agnostic using Python's built-in zipfile/tarfile
        if [ "${{ matrix.archive_type }}" == "zip" ]; then
          cp dist/${{ matrix.binary_name }}* .
          python -m zipfile -c ${{ matrix.id }}.zip ${{ matrix.binary_name }}*
        else
          cp dist/${{ matrix.binary_name }}* .
          tar -czvf ${{ matrix.id }}.tar.gz ${{ matrix.binary_name }}*
        fi

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          *.zip
          *.tar.gz
